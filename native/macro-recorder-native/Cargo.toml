[package]
name = "macro-recorder-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.14", default-features = false, features = ["napi4", "async", "tokio_rt"] }
napi-derive = "2.16.12"
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
napi-build = "2.1.4"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = "symbols"
panic = "unwind"
